name: Build and Release

# Published releases are owned by sign-and-repackage.yml. Keeping that event
# out of this workflow prevents a release created below from starting another
# build-and-release cycle.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
      - latest-gpup-fix
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# Opt all Node.js 20 actions onto the Node.js 24 runtime. GitHub will
# eventually flip this default itself; setting it explicitly silences the
# `actions/checkout@v4` deprecation warning emitted on every run and keeps
# us forward-compatible with the September 2026 Node 20 removal.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup_release:
    name: Setup Release
    outputs:
      publish_release: ${{ steps.setup_release_auto.outputs.publish_release || steps.setup_release_manual.outputs.publish_release }}
      release_body: ${{ steps.setup_release_auto.outputs.release_body || steps.setup_release_manual.outputs.release_body }}
      release_commit: ${{ steps.setup_release_auto.outputs.release_commit || steps.setup_release_manual.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.setup_release_auto.outputs.release_generate_release_notes || steps.setup_release_manual.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.setup_release_auto.outputs.release_tag || steps.setup_release_manual.outputs.release_tag }}
      release_version: ${{ steps.setup_release_auto.outputs.release_version || steps.setup_release_manual.outputs.release_version }}
    permissions:
      contents: write  # read does not work to check squash and merge details
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Release (Auto)
        id: setup_release_auto
        if: github.event_name != 'workflow_dispatch' && github.ref_name != 'latest-gpup-fix'
        uses: LizardByte/setup-release-action@v2025.426.225
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Release (Manual)
        id: setup_release_manual
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'latest-gpup-fix'
        run: |
          SUFFIX=$([ "${{ github.ref_name }}" = "master" ] && echo "" || echo "-dev")
          echo "publish_release=false" >> $GITHUB_OUTPUT
          echo "release_body=Manual build (${{ github.ref_name }})" >> $GITHUB_OUTPUT
          echo "release_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "release_generate_release_notes=false" >> $GITHUB_OUTPUT
          echo "release_tag=manual-$(date +%Y%m%d-%H%M%S)${SUFFIX}" >> $GITHUB_OUTPUT
          echo "release_version=manual-$(date +%Y%m%d-%H%M%S)${SUFFIX}" >> $GITHUB_OUTPUT

  build_win:
    name: Windows
    needs: setup_release
    runs-on: windows-latest
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
            curl

      - name: Update Windows dependencies
        env:
          opus_version: '1.6.1-1'
        shell: msys2 {0}
        run: |
          # download pinned opus version
          opus_tarball="mingw-w64-ucrt-x86_64-opus-${opus_version}-any.pkg.tar.zst"
          wget https://repo.msys2.org/mingw/ucrt64/${opus_tarball}

          # install dependencies
          # NOTE: gcc/gcc-libs were previously pinned to 15.1.0-5 to work around
          # a broken upstream gcc 15.x. Since msys2 has moved on to gcc 16.x and
          # other packages (cmake, etc.) now require gcc-libs 16.x ABI, pinning
          # an old gcc-libs causes cmake.exe to silently fail to load (exit 127).
          # Let pacman install the full toolchain at the current upstream version.
          dependencies=(
            "git"
            "mingw-w64-ucrt-x86_64-cmake"
            "mingw-w64-ucrt-x86_64-ninja"
            "mingw-w64-ucrt-x86_64-cppwinrt"
            "mingw-w64-ucrt-x86_64-curl-winssl"
            "mingw-w64-ucrt-x86_64-graphviz"
            "mingw-w64-ucrt-x86_64-MinHook"
            "mingw-w64-ucrt-x86_64-miniupnpc"
            "mingw-w64-ucrt-x86_64-nlohmann-json"
            # "mingw-w64-ucrt-x86_64-nodejs"  # Replaced by actions/setup-node (vite 8 requires MSVC Node.js)
            # "mingw-w64-ucrt-x86_64-nsis"  # Replaced by Inno Setup
            "mingw-w64-ucrt-x86_64-onevpl"
            "mingw-w64-ucrt-x86_64-openssl"
            "mingw-w64-ucrt-x86_64-toolchain"
            "mingw-w64-ucrt-x86_64-autotools"
          )

          pacman -Syu --noconfirm "${dependencies[@]}"

          # install pinned opus after Syu to prevent upgrade
          pacman --noconfirm -U ${opus_tarball}

      - name: Verify Build Tools
        shell: msys2 {0}
        run: |
          echo "Verifying build tools are installed..."
          which cmake || (echo "cmake not found" && exit 1)
          which ninja || (echo "ninja not found" && exit 1)
          which gcc || (echo "gcc not found" && exit 1)
          
          echo "All build tools verified successfully"
          echo "  CMake: $(cmake --version | head -1)"
          echo "  Ninja: $(ninja --version)"
          echo "  GCC: $(gcc --version | head -1)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Web UI
        shell: pwsh
        run: |
          npm ci
          npm run lint:webui
          npm run test:webui
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:SUNSHINE_SOURCE_ASSETS_DIR = "${{ github.workspace }}\src_assets"
          $env:SUNSHINE_ASSETS_DIR = "${{ github.workspace }}\build"
          npm run build

      - name: Build Windows
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}-gpup
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          GITHUB_TOKEN: ${{ secrets.DRIVER_DOWNLOAD_TOKEN }}
          # Fork PRs cannot access org-scoped secrets, so private-repo driver
          # downloads (vmouse) may fail. Downgrade missing drivers from
          # FATAL_ERROR to WARNING so the build/configure still succeeds; the
          # affected drivers are simply excluded from the installer.
          DRIVER_DEPS_REQUIRED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'OFF' || 'ON' }}
        run: |
          mkdir -p build
          # BOOST_LOCALE_RETRY_FIX
          configure_sunshine() {
            cmake \
              -B build \
              -G Ninja \
              -S . \
              -DBUILD_DOCS=OFF \
              -DBUILD_TRAY_TESTS=ON \
              -DBUILD_WEB_UI=OFF \
              -DSUNSHINE_ASSETS_DIR=assets \
              -DDRIVER_DEPS_REQUIRED=${DRIVER_DEPS_REQUIRED} \
              -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
              -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/AlkaidLab/foundation-sunshine' \
              -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/AlkaidLab/foundation-sunshine/issues'
          }
          if ! configure_sunshine; then
            echo "Checking Boost.Locale source grouping..."

            boost_file="build/_deps/boost-src/libs/locale/CMakeLists.txt"

            if [[ ! -f "$boost_file" ]]; then
              echo "Boost.Locale file not found. Stopping."
              exit 1
            fi

            old='source_group(TREE "${CMAKE_CURRENT_SOURCE_DIR}/include/boost/locale" PREFIX "headers" FILES ${sources_inc})'
            new='source_group(TREE "${CMAKE_CURRENT_SOURCE_DIR}/include" PREFIX "headers" FILES ${sources_inc})'

            if ! grep -Fq "$old" "$boost_file"; then
              echo "Expected Boost.Locale rule not found."
              exit 1
            fi

            BOOST_FILE="$boost_file" python - <<'PY'
import os
from pathlib import Path

p = Path(os.environ["BOOST_FILE"])
text = p.read_text(encoding="utf-8")

old = 'source_group(TREE "${CMAKE_CURRENT_SOURCE_DIR}/include/boost/locale" PREFIX "headers" FILES ${sources_inc})'
new = 'source_group(TREE "${CMAKE_CURRENT_SOURCE_DIR}/include" PREFIX "headers" FILES ${sources_inc})'

if text.count(old) != 1:
    raise SystemExit("Expected exactly one Boost.Locale rule")

p.write_text(text.replace(old, new), encoding="utf-8")
PY

            echo "Boost.Locale rule patched. Retrying CMake..."
            configure_sunshine
          fi

          ninja -C build

      - name: Run native tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Cache Inno Setup
        id: inno-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: inno-setup-6

      - name: Install Inno Setup
        if: steps.inno-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Use the GitHub-hosted Windows runner's Chocolatey package manager.
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install Inno Setup (exit code $LASTEXITCODE)"
          }

      - name: Verify Inno Setup and add to PATH
        shell: pwsh
        run: |
          $innoDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $compiler = Join-Path $innoDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler missing: $compiler"
          }
          $innoDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Inno Setup compiler verified: $compiler"

      - name: Package Windows
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cd build

          # Package the Inno Setup installer and portable ZIP.
          # Install into the staging directory first.
          cmake --install . --prefix ./inno_staging
          
          # Run the Inno Setup compiler.
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" sunshine_installer.iss
          
          # Generate the portable ZIP.
          cpack -G ZIP --config ./CPackConfig.cmake --verbose

          # move
          mv ./cpack_artifacts/Sunshine.exe ../artifacts/sunshine-windows-installer.exe
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      - name: Generate Checksums
        shell: pwsh
        run: |
          # Generate SHA256 checksums.
          .\scripts\generate-checksums.ps1 -Path .\artifacts -Output "SHA256SUMS.txt"

      - name: Package Windows Debug Info
        working-directory: build
        run: |
          # use .dbg file extension for binaries to avoid confusion with real packages
          Get-ChildItem -File -Recurse | `
            % { Rename-Item -Path $_.PSPath -NewName $_.Name.Replace(".exe",".dbg") }

          # save the binaries with debug info
          7z -r `
            "-xr!CMakeFiles" `
            "-xr!cpack_artifacts" `
            a "../artifacts/sunshine-win32-debuginfo.7z" "*.dbg"

      - name: Rename release assets
        shell: msys2 {0}
        run: |
          # Format tag to vYEAR.DATE where DATE is zero-padded to 4 digits
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          NEWTAG="$TAG"

          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi

          # Rename installer and portable package
          mv artifacts/sunshine-windows-installer.exe "artifacts/Sunshine.${NEWTAG}.WindowsInstaller.exe"
          mv artifacts/sunshine-windows-portable.zip "artifacts/Sunshine.${NEWTAG}.WindowsPortable.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows-r${{ github.run_number }}
          path: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.WindowsPortable.zip
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: LizardByte/create-release-action@v2025.426.1549
        with:
          allowUpdates: true
          body: ${{ needs.setup_release.outputs.release_body }}
          generateReleaseNotes: ${{ needs.setup_release.outputs.release_generate_release_notes }}
          name: ${{ needs.setup_release.outputs.release_tag }}-gpup
          prerelease: true
          tag: ${{ needs.setup_release.outputs.release_tag }}-gpup
          token: ${{ secrets.GH_BOT_TOKEN }}
